```yaml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check extract/ warehouse/ orchestration/ staging_minio/ mock_source_api/ dashboard/

      - name: Unit tests (extract logic, schema drift, checkpointing)
        run: pytest tests/unit -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    env:
      WAREHOUSE_PATH: ./warehouse/ecom_ci.duckdb
      SOURCE_API_BASE_URL: http://localhost:8000
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_RAW: raw

    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        command: server /data --console-address ":9001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd dbt_project && dbt deps

      - name: Set up dbt profile for CI
        run: |
          mkdir -p ~/.dbt
          cp dbt_project/profiles.yml.example ~/.dbt/profiles.yml

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time."
          exit 1

      - name: Start mock source API
        run: |
          cd mock_source_api
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Mock API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Mock API did not become ready in time."
          exit 1

      - name: Extract orders
        run: python extract/extract_orders.py

      - name: Upload extracted files to MinIO
        run: python staging_minio/upload_to_minio.py

      - name: Load orders from MinIO into DuckDB
        run: python warehouse/load_orders.py

      - name: dbt build against the populated CI warehouse
        run: |
          cd dbt_project
          dbt build --target ci

      - name: Upload dbt docs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt_project/target
```